<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
<defs>
  <linearGradient id="corpo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EDEDF2"/><stop offset="1" stop-color="#BDBFC9"/></linearGradient>
  <linearGradient id="borda" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#25F4EE"/><stop offset=".2" stop-color="#25F4EE" stop-opacity="0"/>
    <stop offset=".8" stop-color="#FE2C55" stop-opacity="0"/><stop offset="1" stop-color="#FE2C55"/>
  </linearGradient>
  <linearGradient id="tiktok" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#25F4EE"/><stop offset="1" stop-color="#FE2C55"/></linearGradient>
  <linearGradient id="olho" gradientUnits="userSpaceOnUse" x1="0" y1="219.9" x2="0" y2="306.3">
    <stop offset="0" stop-color="#30333D"/><stop offset="1" stop-color="#0A0A0F"/>
  </linearGradient>
  <linearGradient id="reflexo" x1="0" y1="0" x2="0" y2=".25"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8.6"/></filter>
  <filter id="macio" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4.3"/></filter>
  <filter id="bochecha" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <filter id="sombra" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="15.1" stdDeviation="9.7" flood-color="#000" flood-opacity=".45"/></filter>
  <clipPath id="cartao"><rect x="92.0" y="98" width="216" height="384" rx="64.8"/></clipPath>
</defs>
<g transform="translate(0 0)">
  <!-- luz ciano/rosa vazando no fundo -->
  <rect x="92.0" y="98" width="216" height="384" rx="64.8" fill="none" stroke="url(#borda)" stroke-width="8.6" filter="url(#brilho)" opacity=".3"/>
  <!-- corpo fosco, luz de cima, sombra projetada -->
  <rect x="92.0" y="98" width="216" height="384" rx="64.8" fill="url(#corpo)" filter="url(#sombra)"/>
  <g clip-path="url(#cartao)">
    <!-- sombra interna embaixo, luz interna em cima -->
    <g transform="translate(0 -8.6)"><rect x="92.0" y="98" width="216" height="384" rx="64.8" fill="none" stroke="#000" stroke-opacity=".32" stroke-width="30.2" filter="url(#brilho)"/></g>
    <g transform="translate(0 5.4)"><rect x="92.0" y="98" width="216" height="384" rx="64.8" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="8.6" filter="url(#macio)"/></g>
    <!-- borda TikTok como luz lateral -->
    <rect x="92.0" y="98" width="216" height="384" rx="64.8" fill="none" stroke="url(#borda)" stroke-width="15.1" filter="url(#macio)" opacity=".5"/>
    <!-- brilho especular no topo -->
    <ellipse cx="200" cy="160.4" rx="75.6" ry="28.1" fill="#fff" opacity=".6" filter="url(#brilho)"/>
  </g>
  <rect x="93.1" y="99.1" width="213.8" height="381.8" rx="63.7"
        fill="none" stroke="url(#reflexo)" stroke-width="2.2"/>
  <ellipse cx="139.5" cy="295.5" rx="16.2" ry="8.1" fill="#FF7A99" opacity=".32" filter="url(#bochecha)"/>
  <path d="M174.1 241.5 L174.1 263.1" stroke="url(#olho)" stroke-width="30.2" stroke-linecap="round"/><circle cx="180.6" cy="245.8" r="4.5" fill="#fff" opacity=".95"/>
  <ellipse cx="269.1" cy="295.5" rx="16.2" ry="8.1" fill="#FF7A99" opacity=".32" filter="url(#bochecha)"/>
  <path d="M256.2 241.5 L256.2 263.1" stroke="url(#olho)" stroke-width="30.2" stroke-linecap="round"/><circle cx="262.6" cy="245.8" r="4.5" fill="#fff" opacity=".95"/>
  <rect x="156.8" y="428.4" width="28.1" height="11.2" rx="5.6" fill="#121217" opacity="0.78"/><rect x="193.1" y="428.4" width="11.2" height="11.2" rx="5.6" fill="#121217" opacity=".16"/><rect x="212.5" y="428.4" width="11.2" height="11.2" rx="5.6" fill="#121217" opacity=".16"/><rect x="232.0" y="428.4" width="11.2" height="11.2" rx="5.6" fill="#121217" opacity=".16"/>
</g></svg>
