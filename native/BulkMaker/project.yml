# Xcode project for Xcode Cloud (Archive → Developer ID, notarized). Generate with: xcodegen
# Day-to-day dev stays on SwiftPM (run-mac.sh); this mirrors the same targets.
name: TheCarouselMaker
options:
  bundleIdPrefix: com.andrefelipe
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: 4ZQ8PBTL5U
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.11.2
targets:
  CarouselEngine:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/CarouselEngine
  carousel-render:
    type: tool
    platform: macOS
    sources:
      - path: Sources/carousel-render
    dependencies:
      - target: CarouselEngine
    settings:
      base:
        PRODUCT_NAME: carousel-render
        PRODUCT_BUNDLE_IDENTIFIER: com.andrefelipe.carouselmaker.render
        SKIP_INSTALL: YES
  TheCarouselMaker:
    type: application
    platform: macOS
    sources:
      - path: Sources/BulkMaker
      - path: Xcode/BundleModule.swift
    dependencies:
      - package: SwiftTerm
      - target: CarouselEngine
      # The renderer ships next to the app binary; TerminalHandoff copies it into each workspace.
      - target: carousel-render
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: The Carousel Maker
        PRODUCT_BUNDLE_IDENTIFIER: com.andrefelipe.carouselmaker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: The Carousel Maker
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_APP_SANDBOX: NO
    scheme:
      testTargets: []
